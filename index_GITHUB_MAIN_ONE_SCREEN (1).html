<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSES Security Reporting System</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef4fa;color:#102b48}#frame{border:0;width:100%;height:100dvh;display:block}#setup{max-width:620px;margin:10vh auto;padding:20px;background:white;border-radius:14px;box-shadow:0 5px 30px #0002}input{width:100%;padding:13px;border:1px solid #abbcd0;border-radius:8px;margin:12px 0}button{border:0;border-radius:10px;padding:13px 18px;background:#07539a;color:white;font-weight:bold;font-size:16px;cursor:pointer}.overlay{display:none;position:fixed;inset:0;background:#001b35bb;z-index:10;align-items:center;justify-content:center;padding:12px}.panel{background:#fff;border-radius:14px;width:min(600px,100%);padding:18px;box-shadow:0 12px 30px #0004}textarea{width:100%;min-height:170px;border:1px solid #a8b8c9;border-radius:8px;padding:12px;font-size:17px}#status{padding:12px 0;min-height:44px} .row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.muted{background:#e5ebf2;color:#23384e}h2{margin:0 0 8px}
</style></head><body>
<div id="setup"><h2>BSES Security Reporting System</h2><p>पहली बार अपना deployed Apps Script Web App URL यहाँ डालें। यह URL केवल आपके browser में save होगा।</p><input id="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"><button id="open">Open Reporting System</button><p id="setupError" role="alert"></p></div>
<iframe id="frame" title="BSES Reporting System" style="display:none" allow="geolocation; camera"></iframe>
<div class="overlay" id="overlay"><div class="panel"><h2>🎤 हिंदी में बोलें</h2><div id="status" role="status">माइक दबाएँ और हिंदी में बोलें।</div><div class="row"><button id="start">🎤 बोलना शुरू करें</button><button id="stop" class="muted">⏹ रोकें</button></div><textarea id="spoken" placeholder="हिंदी टेक्स्ट यहाँ आएगा; चाहें तो सुधार सकते हैं"></textarea><div class="row"><button id="send">✓ रिपोर्ट में टेक्स्ट भेजें</button><button id="cancel" class="muted">बंद करें</button></div></div></div>
<script>
'use strict';
const frame=document.getElementById('frame'),overlay=document.getElementById('overlay'),statusEl=document.getElementById('status'),spoken=document.getElementById('spoken');
let currentField='',recognition=null,finalText='',expectedOrigin='',voiceSource=null;
const allowedFields=new Set(['grRemark','incStatement','doObservation','doChargeHandedOver']);
function openApp(u){try{const parsed=new URL(u);if(parsed.protocol!=='https:'||parsed.hostname!=='script.google.com'||!/^\/macros\/s\/[^/]+\/exec$/.test(parsed.pathname))throw Error('Invalid Web App URL');expectedOrigin='https://script.google.com';localStorage.setItem('bses_reporting_url',u);frame.src=u;frame.style.display='block';document.getElementById('setup').style.display='none';}catch(e){document.getElementById('setupError').textContent='सही deployed Apps Script Web App URL (/exec) डालें।';}}
document.getElementById('open').onclick=()=>openApp(document.getElementById('url').value.trim());
const stored=localStorage.getItem('bses_reporting_url');if(stored){document.getElementById('url').value=stored;openApp(stored);}
window.addEventListener('message',e=>{
 if(!e.data||e.data.type!=='BSES_VOICE_REQUEST'||!allowedFields.has(e.data.field))return;
 // Apps Script HTMLService iframe is commonly served from script.googleusercontent.com.
 if(!/^https:\/\/(?:script\.google\.com|[a-z0-9.-]*script\.googleusercontent\.com)$/.test(e.origin))return;
 voiceSource=e.source;currentField=e.data.field;spoken.value='';finalText='';statusEl.textContent='🎤 बटन दबाकर हिंदी में बोलें।';overlay.style.display='flex';
});
function stop(){if(recognition){try{recognition.stop()}catch(e){}}}
document.getElementById('start').onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){statusEl.textContent='इस browser में voice recognition नहीं है। Chrome में खोलें।';return;}
 stop();finalText=spoken.value.trim();let r=new SR();recognition=r;r.lang='hi-IN';r.interimResults=true;r.continuous=true;
 r.onstart=()=>{statusEl.textContent='🎤 माइक चालू है — हिंदी में बोलें';};
 r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=(finalText?' ':'')+t;else interim+=t;}spoken.value=(finalText+(interim?' '+interim:'')).trim();};
 r.onerror=e=>{statusEl.textContent='माइक समस्या: '+e.error+(e.error==='not-allowed'?' — GitHub site के लिए Microphone Allow करें।':'');};
 r.onend=()=>{if(statusEl.textContent.startsWith('🎤'))statusEl.textContent='बोलना बंद हुआ।';};
 try{r.start()}catch(e){statusEl.textContent='माइक शुरू नहीं हुआ: '+e.message;}
};
document.getElementById('stop').onclick=stop;
document.getElementById('cancel').onclick=()=>{stop();overlay.style.display='none';};
document.getElementById('send').onclick=()=>{stop();const text=spoken.value.trim();if(!text){statusEl.textContent='पहले कुछ बोलें या लिखें।';return;}if(voiceSource)voiceSource.postMessage({type:'BSES_VOICE_RESULT',field:currentField,text:text},'*');overlay.style.display='none';};
</script></body></html>
