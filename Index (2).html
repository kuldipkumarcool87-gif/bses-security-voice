<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSES Security Reporting System</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef4fa;color:#102b48}#frame{border:0;width:100%;height:100dvh;display:block}#setup{max-width:620px;margin:12px auto;padding:12px;background:white;border-radius:12px;box-shadow:0 3px 14px #0002}input{width:100%;padding:10px;border:1px solid #abbcd0;border-radius:8px;margin:8px 0}button{border:0;border-radius:10px;padding:13px 18px;background:#07539a;color:white;font-weight:bold;font-size:16px;cursor:pointer}.overlay{display:none;position:fixed;inset:0;background:#001b35cc;z-index:100000;align-items:center;justify-content:center;padding:12px}.panel{background:#fff;border-radius:14px;width:min(600px,100%);padding:18px;box-shadow:0 12px 30px #0004}#spoken{width:100%;min-height:135px;border:1px solid #a8b8c9;border-radius:8px;padding:12px;font-size:17px;resize:vertical}#status{padding:12px 0;min-height:44px}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.muted{background:#e5ebf2;color:#23384e}h2{margin:0 0 8px}#stop{background:#b91c1c}#setup summary{cursor:pointer;font-size:13px}#setup details{padding:4px}
</style></head><body>
<div id="setup"><details id="config"><summary>⚙️ Web App URL बदलें / पहली बार सेट करें</summary><input id="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"><button id="open">Open Reporting System</button><p id="setupError" role="alert"></p></details></div>
<iframe id="frame" title="BSES Reporting System" style="display:none" allow="geolocation; camera"></iframe>
<div class="overlay" id="overlay"><div class="panel"><h2>🎤 हिंदी में बोलें</h2><div id="status" role="status" aria-live="polite">माइक चालू हो रहा है…</div><textarea id="spoken" placeholder="आपके बोले हुए शब्द यहाँ दिखाई देंगे"></textarea><div class="row"><button id="retry" class="muted" style="display:none">🎤 दोबारा बोलें</button><button id="stop">■ रिकॉर्डिंग बंद करें — रिपोर्ट में जोड़ें</button><button id="cancel" class="muted">रद्द करें</button></div></div></div>
<script>
'use strict';
const frame=document.getElementById('frame'),overlay=document.getElementById('overlay'),statusEl=document.getElementById('status'),spoken=document.getElementById('spoken');
const allowedFields=new Set(['grRemark','incStatement','doObservation','doChargeHandedOver']);
let currentField='',recognition=null,finalText='',interimText='',voiceSource=null,stopping=false,stopWait=null,session=0;
function openApp(u){try{const parsed=new URL(u);if(parsed.protocol!=='https:'||parsed.hostname!=='script.google.com'||!/^\/macros\/s\/[^/]+\/exec$/.test(parsed.pathname))throw Error('Invalid Web App URL');localStorage.setItem('bses_reporting_url',u);frame.src=u;frame.style.display='block';document.getElementById('config').open=false;document.getElementById('setupError').textContent='';}catch(e){document.getElementById('config').open=true;document.getElementById('setupError').textContent='सही Apps Script Web App URL (/exec) डालें।';}}
document.getElementById('open').onclick=()=>openApp(document.getElementById('url').value.trim());
const stored=localStorage.getItem('bses_reporting_url');if(stored){document.getElementById('url').value=stored;openApp(stored);}else document.getElementById('config').open=true;
function show(msg){statusEl.textContent=msg;}
function render(){spoken.value=[finalText,interimText].filter(Boolean).join(' ').trim();}
function deliver(){if(stopWait){clearTimeout(stopWait);stopWait=null;}const t=spoken.value.trim();if(t&&voiceSource&&currentField){voiceSource.postMessage({type:'BSES_VOICE_RESULT',field:currentField,text:t},'*');}else if(!t){show('आवाज़ दर्ज नहीं हुई। दोबारा बोलें।');return;}overlay.style.display='none';currentField='';voiceSource=null;recognition=null;}
function stopAndSend(){if(stopping)return;stopping=true;show('रिकॉर्डिंग बंद हो रही है, टेक्स्ट रिपोर्ट में जुड़ रहा है…');if(recognition){try{recognition.stop();}catch(e){deliver();return;}stopWait=setTimeout(deliver,1800);}else deliver();}
function cancel(){session++;if(stopWait)clearTimeout(stopWait);if(recognition){try{recognition.abort()}catch(e){}}recognition=null;overlay.style.display='none';currentField='';voiceSource=null;stopping=false;}
function begin(field,source){cancel();document.getElementById('retry').style.display='none';currentField=field;voiceSource=source;finalText='';interimText='';spoken.value='';stopping=false;overlay.style.display='flex';show('🎤 माइक चालू हो रहा है…');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){show('Chrome में Speech Recognition उपलब्ध नहीं है।');return;}const id=++session;const r=new SR();recognition=r;r.lang='hi-IN';r.interimResults=true;r.continuous=true;r.maxAlternatives=1;
r.onstart=()=>{if(id===session)show('🔴 रिकॉर्डिंग चालू है — हिंदी में बोलिए');};
r.onresult=e=>{if(id!==session)return;let interim='';for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript.trim();if(e.results[i].isFinal){if(t)finalText+=(finalText?' ':'')+t;}else interim+=(interim?' ':'')+t;}interimText=interim;render();};
r.onerror=e=>{if(id!==session)return;const err=e.error||'unknown';if(stopping){deliver();return;}if(err==='no-speech'){show('आवाज़ नहीं मिली। स्पष्ट हिंदी में बोलें।');}else show('माइक समस्या: '+err+' — GitHub वेबसाइट की Microphone Permission जाँचें।');};
r.onend=()=>{if(id!==session)return;if(stopping){deliver();return;}recognition=null;if((finalText+' '+interimText).trim()){show('आवाज़ रुकी है। टेक्स्ट रिपोर्ट में भेजने के लिए लाल बटन दबाएँ।');}else{show('आवाज़ दर्ज नहीं हुई। फिर से शुरू करने के लिए 🎤 दबाएँ।');document.getElementById('retry').style.display='block';}};
try{r.start();}catch(e){show('माइक शुरू नहीं हुआ: '+e.message);recognition=null;}
}
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||!/^https:\/\/(?:script\.google\.com|(?:[a-z0-9-]+\.)*script\.googleusercontent\.com)$/.test(e.origin))return;if(!e.data||e.data.type!=='BSES_VOICE_REQUEST'||!allowedFields.has(e.data.field))return;begin(e.data.field,e.source);});
document.getElementById('retry').onclick=()=>begin(currentField,voiceSource);document.getElementById('stop').onclick=stopAndSend;document.getElementById('cancel').onclick=cancel;
</script></body></html>
